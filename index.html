re different ways until you find a way that works well. So mathematics is often used to speed up work, and also to make more money.","Here are some examples:","You have $10. How much change should you get at the store after you pay for the ice cream you want? You will have to know what the ice cream costs where you go to get it.","After I pay my bills, how much money will I have left for fun and other things?","How many more Christmas lights can I connect onto this electrical circuit or wire before the circuit breaker is trying to pass too much electricity and shuts off?","Let us say you want to put on a big party, and you have to pay for it yourself. You add up everything you need to get and it comes to $600. The party is going to be in 5 months. Using math, you can figure out how much money you need to save every week to have $600 by 2 weeks before the party.","Now let us say you want to drive to visit your grandmother who lives 1000 miles away. You want to know how much money you need for gas. You can have a pretty good idea of this if you know how far you need to drive, and how many miles your car goes on each gallon of gas, and how much gas costs for each gallon. If you want to know how to do this, it is explained at the end of this. If you didn't know how to figure this out you would just have to have a whole lot of money and hope it was enough for gas, meals, and a motel room, both ways.","Let us say you want to go to the moon using a rocket. The moon keeps going around the Earth. First you need to figure out how long it's going to take you to get there, using math. Then you need to figure how far the moon will move in that amount of time while you are traveling. Then you can use math to figure out exactly where to aim this rocket and how long to fire the rocket motor so that you end up where the moon will be when you get there, not where it is now.","Is it better to figure this out using mathematics or to send people up 100 or 200 times until someone actually makes it to the Moon?","Computer programs use lots of math, especially for counting things, and figuring things out.","Math is used to help design big bridges that have to hold many, many cars and heavy trucks so that they don't fall down and they last for many, many years. A well-planned and well built bridge can last for hundreds of years and sometimes more.","Math is used to help design and build computer chips. And telephones. And cars. And video games. And buildings that don't fall down.","Math is useful for you to control your money, to help it grow.","What other uses for math can you think of? What else is it good for?",{divider:!0},"How to figure out how much money you need for gas. Divide the miles to drive by your car\u2019s miles per gallon. That gives you how many gallons you will need. You multiply that by the price for each gallon and that gives you your total cost estimate."],f2="\xA9 Brandon D'Rion\xA0\xA0November 2026",di=15,ka={color:"rgba(237,234,224,0.85)",fontSize:di,lineHeight:1.45,margin:"0 0 9px"};function $1({onBack:t}){return(0,s.jsxs)("div",{style:r.card,children:[(0,s.jsxs)("div",{style:r.headerRow,children:[(0,s.jsx)("span",{style:r.times,children:"?"}),(0,s.jsx)("div",{children:(0,s.jsx)("h1",{style:r.h1,children:"Why Math?"})})]}),r2.map((e,l)=>typeof e=="string"?(0,s.jsx)("p",{style:ka,children:e},l):e.h?(0,s.jsx)("p",{style:{...ka,textAlign:"center",marginTop:18},children:e.h},l):(0,s.jsx)("div",{style:{marginTop:Math.round(di*1.45)*2+9,marginBottom:12,borderTop:"1px solid rgba(237,234,224,0.5)"}},l)),(0,s.jsx)("div",{style:{height:Math.round(di*1.45)}}),(0,s.jsx)("p",{style:{...ka,fontSize:Math.round(di*.75),whiteSpace:"pre-wrap"},children:f2}),(0,s.jsx)("div",{style:{height:14}}),(0,s.jsx)("button",{style:r.primaryBtn,onClick:t,children:"Go Back"})]})}var d2=["To sing a song you have to know the words. To understand a subject you need to understand each word, then it is almost easy.","These are words used in this app that you may not know. The definitions are written to be clear for kids to understand. Many of the words have other definitions. The definitions here match the way the words are used in this app. They are in alphabetical order.","Study and use definitions any time something is unclear!"],h2=[{w:"add",d:"To put numbers together to find how many there are in all. 3 + 2 = 5."},{w:"addition",d:"The part of math where you add, or learn how to add. The + sign means add."},{w:"AI",d:"Short for Artificial Intelligence. A computer program that can answer questions and do some thinking jobs."},{w:"arithmetic",d:"Learning numbers and learning to work with numbers such as adding them, subtracting or taking away numbers from numbers, multiplying numbers and dividing numbers. It is the first part of mathematics."},{w:"artificial",d:"Made by people, not by nature."},{w:"average",d:"When there is more than one number you are using or looking at, the average is a number somewhere between the smallest and the biggest number.",more:["Here is how you figure the average of two or more numbers. You add all the numbers together, then divide that answer by how many numbers you added. If 3 separate numbers were added, you divide that answer by 3. If you added 100 numbers, you divide that answer by 100. Division is splitting up a number, so this splits that answer into equal parts. Each part is the average.","What is the average of 2, 4, and 9?","First add them up: 2+4+9 = 15.","3 numbers were added together.","15 split into 3 equal parts gives 5 items in each part.","15 \xF7 3 = 5","So the average of 2, 4, and 9 is 5.","The average will be a number less than the biggest number, but bigger than the smallest number. 5 is less than 9, and 5 is bigger than 2. The average may or may not be the middle number. But if all the numbers are the same, like 8, 8, 8 the average will be that same number, 8."]},{w:"avg",d:'A short way to write "average."'},{w:"backup",d:"A saved copy of your history and settings, so you don't lose them if something goes wrong. Backup is used in computers and for papers to mean a saved copy of all your information, pictures and whatever you save.",more:["It is also used to mean to make a backup."],gap:!0},{w:"breaker",d:'In "circuit breaker": a switch in a house that turns the electricity off by itself when too much electricity goes through a wire, so the wire does not get too hot.'},{w:"browser",d:"The app you use to look at websites, like Chrome, Safari, Edge, or Firefox."},{w:"circuit",d:"A complete path that electricity goes around through wires and parts."},{w:"confirm",d:'To say or do something that means "yes, I am sure" before something happens.'},{w:"crown",d:"1. A ring, often of gold, that a king or queen wears on the head. 2. The power or job of being king or queen. In this app, a Crown Math Wiz is next in line to become Math Wiz King."},{w:"custom",d:"Picked by you, instead of using one of the choices the app already has."},{w:"delete",d:"To remove something completely, like removing a saved user."},{w:"device",d:"A phone, tablet, or computer."},{w:"Div.",d:"Short for Divide or Division."},{w:"divide",d:"To split a number into equal parts, or to find how many times one number fits into another. Sometimes a smaller part is left over. 12 \xF7 3 = 4."},{w:"division",d:"The part of math where you divide, or learn how to divide. The \xF7 sign means divide. Division undoes multiplication: 3 \xD7 4 = 12, so 12 \xF7 3 = 4."},{w:"electrical",d:"Using or carrying electricity, like an electrical wire."},{w:"especially",d:"More than the others, or very much."},{w:"facts",d:"Math questions, like 7 \xD7 8, that you practice until you know them by heart."},{w:"file",d:"Saved information on a phone, tablet, or computer that you can open again later."},{w:"gallon",d:"A way to measure how much liquid there is, like gas or milk. A big jug of milk holds about 1 gallon."},{w:"intelligence",d:"Being able to learn, think, and understand things."},{w:"intro"
